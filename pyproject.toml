[project]
name = "py-token-usage-reducer"
version = "0.1.0"
description = "A python program providing tools to reduce your token usage when working with coding agents."
requires-python = ">=3.11"


license = { text = "MIT" }

dependencies = [
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.20.1",
    "pyside6",
    "python-docx>=1.2.0",
    "tiktoken>=0.14.0",
]

[project.scripts]



py-token-usage-reducer = "src.main:main"
ptur-build = "src.build:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
